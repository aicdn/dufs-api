<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源下载站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .tab:hover {
            background: #f0f0f0;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            border-color: #667eea;
        }
        
        .search-box button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            flex-wrap: wrap;
        }
        
        .breadcrumb span {
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .breadcrumb span:hover {
            color: #667eea;
        }
        
        .breadcrumb span:last-child {
            color: #333;
            font-weight: 500;
            cursor: default;
        }
        
        .breadcrumb .sep {
            color: #ccc;
            cursor: default;
        }
        
        .breadcrumb .sep:hover {
            color: #ccc;
        }
        
        .file-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
            cursor: pointer;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-item:hover {
            background: #f8f9ff;
        }
        
        .file-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 1.5rem;
        }
        
        .file-icon.folder {
            color: #ffc107;
        }
        
        .file-icon.file {
            color: #667eea;
        }
        
        .file-info {
            flex: 1;
            min-width: 0;
        }
        
        .file-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-path {
            font-size: 0.85rem;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-actions {
            display: flex;
            gap: 10px;
            margin-left: 16px;
        }
        
        .btn-download {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        
        .btn-download:hover {
            background: #218838;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .loading::before {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
            background: #fff5f5;
            border-radius: 8px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #999;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5rem; }
            .tabs { flex-direction: column; }
            .tab { width: 100%; }
            .search-box { flex-direction: column; }
            .file-item { flex-wrap: wrap; }
            .file-actions { width: 100%; margin-top: 10px; margin-left: 0; }
            .btn-download { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>资源下载站</h1>
        <p>xz.posw.cn & xz.pcpos.cn 文件资源</p>
    </div>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" data-server="xz.posw.cn">xz.posw.cn</button>
            <button class="tab" data-server="xz.pcpos.cn">xz.pcpos.cn</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索文件...">
            <button id="searchBtn">搜索</button>
        </div>
        
        <div class="breadcrumb" id="breadcrumb">
            <span data-path="/">根目录</span>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div class="file-list" id="fileList">
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <div class="footer">
        <p>Pan.posw.cn - 资源下载站</p>
    </div>
    
    <script>
        const API_BASE = 'https://dufs.api.posw.cn';
        const SERVERS = {
            'xz.posw.cn': 'https://xz.posw.cn',
            'xz.pcpos.cn': 'https://xz.pcpos.cn'
        };
        
        let currentServer = 'xz.posw.cn';
        let currentPath = '/';
        let searchQuery = '';
        
        const tabs = document.querySelectorAll('.tab');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const breadcrumb = document.getElementById('breadcrumb');
        const fileList = document.getElementById('fileList');
        const stats = document.getElementById('stats');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentServer = tab.dataset.server;
                currentPath = '/';
                searchQuery = '';
                searchInput.value = '';
                loadFiles();
            });
        });
        
        searchBtn.addEventListener('click', () => {
            searchQuery = searchInput.value.trim();
            loadFiles();
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchQuery = searchInput.value.trim();
                loadFiles();
            }
        });
        
        function updateBreadcrumb() {
            const parts = currentPath.split('/').filter(Boolean);
            let html = '<span data-path="/">根目录</span>';
            let path = '';
            
            parts.forEach((part, i) => {
                path += '/' + part;
                html += `<span class="sep">/</span>`;
                html += `<span data-path="${path}">${part}</span>`;
            });
            
            breadcrumb.innerHTML = html;
            
            breadcrumb.querySelectorAll('span[data-path]').forEach(span => {
                span.addEventListener('click', () => {
                    currentPath = span.dataset.path;
                    searchQuery = '';
                    searchInput.value = '';
                    loadFiles();
                });
            });
        }
        
        function getFileIcon(name, isDir) {
            if (isDir) return '📁';
            
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                'mp4': '🎬', 'mkv': '🎬', 'avi': '🎬', 'mov': '🎬', 'wmv': '🎬',
                'mp3': '🎵', 'wav': '🎵', 'flac': '🎵', 'aac': '🎵',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'webp': '🖼️',
                'pdf': '📄', 'doc': '📄', 'docx': '📄', 'txt': '📄',
                'zip': '📦', 'rar': '📦', '7z': '📦', 'tar': '📦', 'gz': '📦',
                'exe': '⚙️', 'msi': '⚙️', 'dmg': '⚙️',
                'iso': '💿', 'img': '💿'
            };
            
            return icons[ext] || '📄';
        }
        
        function formatSize(name, isDir) {
            return isDir ? '文件夹' : '';
        }
        
        async function loadFiles() {
            updateBreadcrumb();
            
            fileList.innerHTML = '<div class="loading">加载中...</div>';
            stats.textContent = '';
            
            let url = `${API_BASE}/files?path=${encodeURIComponent(currentPath)}`;
            if (searchQuery) {
                url += `&q=${encodeURIComponent(searchQuery)}`;
            }
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                let files = data.files || [];
                
                if (searchQuery) {
                    stats.textContent = `找到 ${files.length} 个结果`;
                } else {
                    stats.textContent = `共 ${files.length} 项`;
                }
                
                if (files.length === 0) {
                    fileList.innerHTML = '<div class="empty">暂无文件</div>';
                    return;
                }
                
                files.sort((a, b) => {
                    if (a.isDir !== b.isDir) return b.isDir - a.isDir;
                    return a.name.localeCompare(b.name);
                });
                
                let html = '';
                files.forEach(file => {
                    const icon = getFileIcon(file.name, file.isDir);
                    const serverUrl = SERVERS[currentServer];
                    const downloadUrl = `${serverUrl}/${file.path.replace(/^\//, '')}`;
                    
                    html += `
                        <div class="file-item" onclick="${file.isDir ? `navigateTo('${file.path}')` : `window.open('${downloadUrl}', '_blank')`}">
                            <div class="file-icon ${file.isDir ? 'folder' : 'file'}">${icon}</div>
                            <div class="file-info">
                                <div class="file-name">${file.name}</div>
                                <div class="file-path">${file.path}</div>
                            </div>
                            <div class="file-actions">
                                <a href="${downloadUrl}" target="_blank" class="btn-download" onclick="event.stopPropagation()">下载</a>
                            </div>
                        </div>
                    `;
                });
                
                fileList.innerHTML = html;
            } catch (error) {
                fileList.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        function navigateTo(path) {
            currentPath = path;
            searchQuery = '';
            searchInput.value = '';
            loadFiles();
        }
        
        loadFiles();
    </script>
</body>
</html>
